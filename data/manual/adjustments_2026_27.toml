# Manuelle Korrekturen für die Projektionen 2026-27 (Stand: 28.09.2026).
#
# Alle Felder sind optional:
#   games         = erwartete Spiele (überschreibt die Berechnung aus der Verletzungshistorie)
#   minutes       = erwartete Minuten pro Spiel (überschreibt die Berechnung)
#   minutes_delta = Minuten pro Spiel dazu/weg (z. B. -4 bei Bankrolle)
#   production    = Faktor auf alle Zählstatistiken pro Minute (z. B. 0.92 nach schwerer Verletzung)
#   stats         = Faktoren je Statistik, z. B. { pts = 1.1, reb = 1.15 }
#                   Schlüssel: pts, reb, ast, stl, blk, tpm, tov, fga, fta
#   fg_pct/ft_pct = Wurfquote überschreiben (0.0–1.0)
#   team          = Team überschreiben (Kürzel, z. B. "LAL")
#   note          = Hinweis, der in der Oberfläche angezeigt wird
#
# Quellen: Verletzungsberichte (CBS Sports, Yahoo Sports, NBC Sports) Ende September 2026,
# Hinweise aus der ursprünglichen Draft-Assistent-HTML.

