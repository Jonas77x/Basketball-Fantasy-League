<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Fantasy-Assistent{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <span class="brand">Fantasy-Assistent</span>
  <a href="/draft?kind=live" class="{% if active == 'live' %}on{% endif %}">Draft</a>
  <a href="/draft?kind=practice" class="{% if active == 'practice' %}on{% endif %}">Übungs-Draft</a>
  <span class="spacer"></span>
</div></nav>
{% block body %}{% endblock %}
</body>
</html>
